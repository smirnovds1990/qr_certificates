services:
  backend_db:
    image: postgres:17.5-bookworm
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - src/.env
    restart: always
    ports:
      - "5432:5432"
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - src/.env
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - backend_db
    volumes:
     - media_data:/src/media
  mailhog:
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
volumes:
  pg_data:
  media_data: