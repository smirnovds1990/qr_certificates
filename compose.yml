services:
  backend_db:
    image: postgres:17.5-bookworm
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always
    ports:
      - "5432:5432"
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - .env
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - backend_db
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
volumes:
  pg_data: